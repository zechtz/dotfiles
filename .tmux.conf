### -------------------------------
### 🐚 Default Shell & Command
### -------------------------------

# set-option -g default-shell /bin/bash
# set-option -g default-command /bin/bash


### -------------------------------
### 📦 Prefix & Keybindings
### -------------------------------

unbind C-b
set -g prefix C-a
bind a send-prefix
bind r source-file ~/.tmux.conf \; display "Reloaded!"

bind | split-window -h
bind - split-window -v

bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

bind C-k copy-mode


### -------------------------------
### 🎨 Terminal & Display Settings
### -------------------------------

set-option -g default-terminal 'screen-254color'
set-option -g terminal-overrides ',xterm-256color:RGB'
set -g default-terminal "${TERM}"

set -g base-index 1
set -g detach-on-destroy off
set -g escape-time 0
set -g history-limit 1000000
set -g renumber-windows on
set -g set-clipboard on
set -g status-position bottom
set -g status-justify centre
setw -g mode-keys vi

set -g -a terminal-overrides ',*:Ss=\E[%p1%d q:Se=\E[2 q'


### -------------------------------
### 🎨 Pane Border Styling
### -------------------------------

set -g pane-active-border-style 'fg=magenta,bg=default'
set -g pane-border-style 'fg=brightblack,bg=default'


### -------------------------------
### 🔌 Plugins (TPM)
### -------------------------------

set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @plugin 'fcsonline/tmux-thumbs'

set -g @plugin 'sainnhe/tmux-fzf'
set -g @plugin 'wfxr/tmux-fzf-url'
set -g @plugin 'omerxx/tmux-sessionx'
set -g @plugin 'omerxx/tmux-floax'

set -g @plugin 'tmux-plugins/tmux-online-status'
set -g @plugin 'tmux-plugins/tmux-battery'
set -g @plugin 'catppuccin/tmux'


### -------------------------------
### ⚙️ Plugin Configuration
### -------------------------------

# Floax
set -g @floax-width '80%'
set -g @floax-height '80%'
set -g @floax-border-color 'magenta'
set -g @floax-text-color 'blue'
set -g @floax-bind 'p'
set -g @floax-change-path 'true'


#####################################################
## Sessionx (unchanged)
#####################################################

set -g @sessionx-bind 'o'
set -g @sessionx-bind-zo-new-window 'ctrl-y'
set -g @sessionx-auto-accept 'off'
set -g @sessionx-zoxide-mode 'on'
set -g @sessionx-custom-paths '/Volumes/Work/work/dotfiles'
set -g @sessionx-custom-paths-subdirectories 'false'
set -g @sessionx-filter-current 'false'

set -g @continuum-restore 'off'
set -g @resurrect-strategy-nvim 'session'


### -------------------------------
### 🚀 ZOXIDE NESTED DIR SESSION LAUNCHER
### -------------------------------
# Ctrl-o → floating popup → fuzzy zoxide → new tmux session

bind-key C-o display-popup -E -w 80% -h 80% "
  selected=\$(zoxide query -l | fzf --prompt='󰋜 zoxide > ' --border --height=100%);
  if [ -n \"\$selected\" ]; then
    name=\$(basename \"\$selected\");
    tmux has-session -t \"\$name\" 2>/dev/null || tmux new-session -d -s \"\$name\" -c \"\$selected\";
    tmux switch-client -t \"\$name\";
  fi
"


### -------------------------------
### 🎨 Catppuccin Theme
### -------------------------------

set -g @catppuccin_flavor "macchiato"
set -g @catppuccin_status_background "none"
set -g @catppuccin_window_status_style "none"
set -g @catppuccin_pane_status_enabled "off"
set -g @catppuccin_pane_border_status "off"


### -------------------------------
### 📟 Statusline
### -------------------------------

set -g status-style 'bg=terminal'

set -g @online_icon "ok"
set -g @offline_icon "nok"

set -g status-left-length 100
set -g status-left ""
set -ga status-left "#{?client_prefix,#[bold]  #S ,  #S }"
set -ga status-left "│  #{pane_current_command} │  #{b:pane_current_path} "

set -g status-right-length 100
set -g status-right ""


### -------------------------------
### 🪄 Vim / Neovim Integration
### -------------------------------

is_vim="ps -o state= -o comm= -t '#{pane_tty}' | grep -iqE 'vim|nvim|fzf'"

set-hook -g pane-focus-in 'if-shell "$is_vim" "set status off" "set status on"'
set-hook -g pane-focus-out 'set status on'


### -------------------------------
### 🚀 TPM Bootstrap
### -------------------------------

if "test ! -d ~/.tmux/plugins/tpm" \
   "run 'git clone https://github.com/tmux-plugins/tpm ~/.tmux/plugins/tpm && ~/.tmux/plugins/tpm/bin/install_plugins'"

run '~/.tmux/plugins/tpm/tpm'
